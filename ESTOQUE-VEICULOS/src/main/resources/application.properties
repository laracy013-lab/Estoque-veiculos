spring.application.name=estoque-veiculos
server.port=8080

# ---- Conexão com o MySQL (banco criado no Workbench) ----
spring.datasource.url=jdbc:mysql://localhost:3306/estoque_veiculos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=estoque
spring.datasource.password=estoque123

# ---- JPA / Hibernate ----
# "update" cria/atualiza as tabelas automaticamente na primeira execução
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
